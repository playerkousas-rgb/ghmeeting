<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>小童軍集會套包 · Grasshopper Kit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --g:#2e7d32; --gl:#e8f5e9; --gd:#1b5e20;
 --r:#e53935; --b:#1e88e5; --y:#f9a825; --p:#8e24aa; --o:#fb8c00;
 --ink:#21301f; --paper:#f4f8f1; --card:#ffffff; --line:#d7e4d0;
 --shadow:0 4px 14px rgba(30,70,30,.12);
}
html,body{margin:0;padding:0}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.55}
button{font-family:inherit}
#hd{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#hd .logo{font-size:28px;line-height:1}
#hd .tt{font-size:18px;font-weight:800;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd .sub{font-size:11px;opacity:.85;margin-top:-3px}
#hd .home{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;font-size:14px;font-weight:700;padding:8px 13px;border-radius:999px;cursor:pointer;flex:none}
#hd .home:active{transform:scale(.94)}
main{max-width:920px;margin:0 auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card h2{margin:0 0 4px;font-size:20px}
.card h3{margin:0 0 4px;font-size:17px}
.mute{color:#5b6f57;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:12px 18px;font-size:17px;font-weight:800;cursor:pointer;background:var(--g);color:#fff;box-shadow:0 3px 0 var(--gd);margin:4px 4px 4px 0;min-height:48px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gd)}
.btn.gray{background:#78909c;box-shadow:0 3px 0 #546e7a}
.btn.red{background:var(--r);box-shadow:0 3px 0 #b71c1c}
.btn.blue{background:var(--b);box-shadow:0 3px 0 #1565c0}
.btn.yellow{background:var(--y);box-shadow:0 3px 0 #c79600;color:#5b4300}
.btn.purple{background:var(--p);box-shadow:0 3px 0 #5e0d78}
.btn.orange{background:var(--o);box-shadow:0 3px 0 #bf5700}
.btn.ghost{background:#fff;color:var(--gd);border:2px solid var(--g);box-shadow:0 3px 0 var(--gl)}
.btn.sm{padding:8px 12px;font-size:15px;min-height:40px;border-radius:11px}
.btn.big{font-size:22px;padding:18px 22px;min-height:64px;border-radius:18px}
.btn.huge{font-size:28px;padding:24px;min-height:84px;border-radius:22px;width:100%}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:640px){.g4{grid-template-columns:repeat(2,1fr)}}
.homegrid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(max-width:520px){.homegrid{grid-template-columns:repeat(2,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 10px;text-align:center;cursor:pointer;transition:transform .08s}
.tile:active{transform:scale(.95)}
.tile .ic{font-size:34px;line-height:1.2}
.tile .nm{font-weight:800;font-size:15.5px;margin-top:4px}
.tile .ds{font-size:12px;color:#5b6f57}
.tag{display:inline-block;background:var(--gl);color:var(--gd);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;margin:2px 4px 2px 0}
.tag.o{background:#fff3e0;color:#e65100}.tag.b{background:#e3f2fd;color:#1565c0}.tag.r{background:#ffebee;color:#c62828}.tag.p{background:#f3e5f5;color:#6a1b9a}.tag.y{background:#fffde7;color:#8d6e00}
hr.sep{border:none;border-top:2px dashed var(--line);margin:14px 0}
.big-msg{text-align:center;font-size:clamp(28px,8vw,54px);font-weight:900;padding:18px 6px;line-height:1.25}
.center{text-align:center}
input[type=text],input[type=number],textarea,select{font-family:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
label.fld{display:block;font-weight:800;font-size:14px;margin:10px 0 4px;color:#3d5238}
/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabs .tb{flex:1;text-align:center;border:none;background:none;font-size:11.5px;font-weight:800;color:#7d8f78;cursor:pointer;padding:4px 2px;border-radius:12px}
#tabs .tb .ti{font-size:22px;display:block;line-height:1.25}
#tabs .tb.on{color:var(--gd);background:var(--gl)}
/* flow */
.stage{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:#fff;border:2px solid var(--line);margin:8px 0}
.stage.on{border-color:var(--g);background:var(--gl);box-shadow:var(--shadow)}
.stage .no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px}
.stage .inf{flex:1;min-width:0}
.stage .nm{font-weight:800;font-size:16.5px}
.stage .mn{font-size:12.5px;color:#5b6f57}
.stage .clk{flex:none;font-variant-numeric:tabular-nums;font-weight:900;font-size:22px;color:var(--gd)}
.stage.done{opacity:.5}
.stage.done .no{background:#9e9e9e}
.flowbar{height:14px;background:#e0e8dd;border-radius:999px;overflow:hidden;margin:8px 0}
.flowbar i{display:block;height:100%;background:linear-gradient(90deg,#66bb6a,#2e7d32);transition:width .5s}
/* traffic */
#tl{border-radius:22px;margin:10px 0;text-align:center;padding:38px 10px;color:#fff;font-weight:900;font-size:clamp(46px,14vw,90px);text-shadow:0 3px 8px rgba(0,0,0,.25);transition:background .2s}
/* simon says */
.cmdbox{background:#fff;border:3px solid var(--line);border-radius:22px;padding:26px 12px;text-align:center;min-height:180px;display:flex;flex-direction:column;justify-content:center}
.cmdbox .pre{font-size:18px;font-weight:800;color:var(--gd)}
.cmdbox .cmd{font-size:clamp(30px,9vw,52px);font-weight:900;margin-top:6px}
/* memory */
.memgrid{display:grid;gap:8px}
.mcard{aspect-ratio:1/1;border-radius:14px;background:linear-gradient(145deg,#43a047,#2e7d32);color:#fff;font-size:clamp(26px,7vw,44px);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:0 3px 0 var(--gd);transition:transform .12s}
.mcard:active{transform:scale(.93)}
.mcard.up{background:#fff;border:3px solid var(--b);color:var(--ink);box-shadow:0 3px 0 #90caf9}
.mcard.ok{background:var(--gl);border:3px solid var(--g);box-shadow:none;cursor:default;opacity:.9}
/* whack */
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.wh{aspect-ratio:1/1;border-radius:16px;border:3px solid var(--line);background:#fff;font-size:clamp(34px,11vw,58px);display:flex;align-items:center;justify-content:center;cursor:pointer}
.wh:active{transform:scale(.93)}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px;font-size:18px;font-weight:700;margin:8px 0;cursor:pointer}
.opt:active{transform:scale(.98)}
.opt.right{background:#c8e6c9;border-color:#2e7d32}
.opt.wrong{background:#ffcdd2;border-color:#c62828}
.opt[disabled]{cursor:default;color:inherit}
.scorebar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sc{border-radius:12px;color:#fff;font-weight:900;padding:6px 12px;font-size:15px;min-width:86px;text-align:center}
/* echo pads */
.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:420px;margin:12px auto}
.pad{aspect-ratio:1.6/1;border-radius:18px;border:none;color:#fff;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);opacity:.55;transition:opacity .1s,transform .1s}
.pad.lit{opacity:1;transform:scale(1.04)}
/* guess */
.silh{font-size:clamp(90px,26vw,180px);text-align:center;line-height:1.1;filter:brightness(0);user-select:none}
.silh.half{filter:brightness(.55)}
.silh.full{filter:none}
/* judge */
.vote{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.vote .v{font-size:60px;padding:18px;border-radius:20px;border:3px solid var(--line);background:#fff;cursor:pointer}
.vote .v:active{transform:scale(.94)}
/* wheel */
#wcv{display:block;margin:8px auto;max-width:100%}
/* breath */
.bwrap{height:300px;display:flex;align-items:center;justify-content:center}
.ball{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#81c784,#2e7d32);transition:transform 3.8s ease-in-out;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px}
/* badges */
.kid{border:2px solid var(--line);border-radius:16px;margin:10px 0;background:#fff}
.kid>button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;padding:12px 14px;font-size:17px;font-weight:800;cursor:pointer;text-align:left}
.kid .bd{margin-left:auto;display:flex;gap:4px}
.dot{width:14px;height:14px;border-radius:50%;background:#cfd8cf}
.dot.on{background:var(--g)}
.kbody{padding:4px 14px 14px;border-top:2px dashed var(--line)}
.ckrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef3ea}
.ck{width:44px;height:44px;border-radius:12px;border:3px solid #cfd8cf;background:#fff;font-size:22px;cursor:pointer;flex:none}
.ck.on{border-color:var(--g);background:var(--gl)}
.stepbtn{flex:1;border:3px solid #cfd8cf;background:#fff;border-radius:12px;padding:8px 4px;font-weight:800;font-size:14px;cursor:pointer;color:#78909c}
.stepbtn.s1{border-color:#c62828;background:#ffebee;color:#c62828}
.stepbtn.s2{border-color:#ef6c00;background:#fff3e0;color:#e65100}
.stepbtn.s3{border-color:#2e7d32;background:#c8e6c9;color:#1b5e20}
/* chute cards */
.chute{background:linear-gradient(160deg,#fffde7,#fff);border:2px solid #f0e6a8;border-radius:20px;padding:18px;text-align:center}
.chute .big{font-size:52px}
/* book */
.promise{background:linear-gradient(150deg,#1b5e20,#388e3c);color:#fff;border-radius:20px;padding:26px 18px;text-align:center;box-shadow:var(--shadow)}
.promise .zh{font-size:clamp(24px,6.5vw,36px);font-weight:900;line-height:1.6}
.promise .en{font-size:14px;opacity:.85;margin-top:10px;font-style:italic}
.songln{text-align:center;font-size:clamp(20px,5.5vw,28px);font-weight:800;margin:6px 0}
/* story dice */
.die{background:#fff;border:3px solid var(--line);border-radius:18px;font-size:clamp(40px,11vw,64px);text-align:center;padding:14px 6px;cursor:pointer;user-select:none}
.die:active{transform:scale(.94)}
/* number timer */
#tnum{font-variant-numeric:tabular-nums;font-weight:900;text-align:center;font-size:clamp(64px,20vw,130px);line-height:1.1;margin:6px 0}
.spin{animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
/* ===== 帶領模式(投影) ===== */
body.live{background:radial-gradient(1200px 800px at 50% -10%,#123d18,#07130a 70%)}
body.live #hd{display:none}
body.live #tabs{display:none}
body.live main{max-width:100%;padding:10px 10px 132px}
#liveStage{min-height:calc(100vh - 150px);display:flex;flex-direction:column;align-items:center;justify-content:center}
#liveKid{width:100%;max-width:940px;margin:0 auto;text-align:center}
.lbar{position:fixed;left:0;right:0;bottom:0;z-index:90;background:rgba(5,18,8,.97);border-top:2px solid #2e7d32;display:flex;align-items:center;gap:7px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));color:#cfe8cf}
.lbar .lb{border:none;border-radius:12px;padding:10px 13px;font-weight:900;font-size:15px;cursor:pointer;background:#2e7d32;color:#fff;min-height:44px;flex:none}
.lbar .lb.gray{background:#37474f}
.lbar .info{flex:1;min-width:0;font-size:12.5px;line-height:1.4}
.lbar .clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:24px;color:#a5d6a7;padding-left:4px;flex:none}
.hline{font-size:clamp(30px,8.5vw,76px);font-weight:900;color:#fff;line-height:1.35;text-shadow:0 4px 18px rgba(0,0,0,.55)}
.hsub{font-size:clamp(16px,3.5vw,26px);color:#a5d6a7;margin-top:8px}
body.live .opt{font-size:clamp(19px,4.2vw,32px);padding:14px;border-width:3px}
body.live .btn.big{font-size:clamp(18px,4.5vw,34px)}
body.live .btn.huge{font-size:clamp(20px,5vw,40px)}
body.live #tl{font-size:clamp(60px,18vw,150px);padding:30px 8px}
body.live .wgrid{max-width:640px;margin:0 auto}
body.live .wh{font-size:clamp(44px,13vw,76px)}
body.live .cmdbox .cmd{font-size:clamp(38px,10vw,80px)}
body.live .cmdbox{background:rgba(255,255,255,.94)}
body.live .sc{font-size:17px}
body.live .tag{font-size:14px}
.rolgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.rolname{font-size:clamp(22px,5.5vw,40px);font-weight:900;color:#fff;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);padding:10px 18px;border-radius:18px;cursor:pointer}
.rolname:active{transform:scale(.94)}
.rolname.on{opacity:.4;border-color:#a5d6a7}
.flashtime{animation:fl 1s infinite}
@keyframes fl{50%{opacity:.35}}
body.live .silh{font-size:clamp(110px,28vw,280px)}
body.live .vote .v{font-size:clamp(56px,15vw,110px);padding:22px}
body.live .die{font-size:clamp(40px,10vw,80px)}
body.live .pad{font-size:clamp(26px,7vw,44px)}
body.live .mcard{font-size:clamp(30px,8vw,64px)}
body.live .card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15)}
body.live .mute{color:#9ccc9c}

@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .3s}
.linkish{background:none;border:none;color:var(--b);font-weight:700;cursor:pointer;font-size:15px;padding:6px 4px;text-decoration:underline}
table.plain{width:100%;border-collapse:collapse;font-size:15px}
table.plain th,table.plain td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
table.plain th{background:var(--gl);color:var(--gd)}
</style>
</head>
<body>
<div id="hd">
 <div class="logo">🦗</div>
 <div>
  <div class="tt" id="hdt">小童軍集會套包</div>
  <div class="sub">認識自己・快樂同行 ｜ © Scout System</div>
 </div>
 <button class="home" onclick="go('home')">🏠 首頁</button>
</div>
<main id="view"></main>
<nav id="tabs">
 <button class="tb" data-t="home" onclick="go('home')"><span class="ti">🏠</span>首頁</button>
 <button class="tb" data-t="flow" onclick="go('flow')"><span class="ti">⏱️</span>集會流程</button>
 <button class="tb" data-t="arcade" onclick="go('arcade')"><span class="ti">🎮</span>遊戲樂園</button>
 <button class="tb" data-t="tools" onclick="go('tools')"><span class="ti">🧰</span>領袖工具</button>
 <button class="tb" data-t="book" onclick="go('book')"><span class="ti">📖</span>手冊</button>
</nav>
<script>
"use strict";
/* ============ 基本工具 ============ */
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var store={
 mem:{},
 get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return (k in this.mem)?this.mem[k]:d}},
 set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){this.mem[k]=v}},
 del:function(k){try{localStorage.removeItem(k)}catch(e){delete this.mem[k]}}
};

/* ============ 音效引擎(全合成,離線可用) ============ */
var Sfx={
 ctx:null,
 on:store.get('ghk_snd',true),
 ac:function(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==='suspended'){this.ctx.resume()}return this.ctx},
 tone:function(f,d,type,v,delay){if(!this.on)return;var c=this.ac();if(!c)return;var t=c.currentTime+(delay||0);var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)},
 noise:function(d,v,delay){if(!this.on)return;var c=this.ac();if(!c)return;var t=c.currentTime+(delay||0);var b=c.createBuffer(1,Math.max(1,Math.floor(c.sampleRate*d)),c.sampleRate);var data=b.getChannelData(0);for(var i=0;i<data.length;i++){data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,1.4)}var s=c.createBufferSource();s.buffer=b;var g=c.createGain();g.gain.value=v;s.connect(g);g.connect(c.destination);s.start(t)},
 whistle:function(){if(!this.on)return;var c=this.ac();if(!c)return;var t=c.currentTime;for(var i=0;i<2;i++){var o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(1900,t+i*.42);o.frequency.linearRampToValueAtTime(2700,t+i*.42+.32);g.gain.setValueAtTime(.09,t+i*.42);g.gain.linearRampToValueAtTime(.0001,t+i*.42+.38);o.connect(g);g.connect(c.destination);o.start(t+i*.42);o.stop(t+i*.42+.4)}},
 bell:function(){this.tone(880,1.1,'sine',.25);this.tone(1760,.8,'sine',.1,.01);this.tone(2640,.45,'sine',.05,.02)},
 ding:function(){this.tone(1318,.35,'sine',.22);this.tone(1760,.5,'sine',.12,.02)},
 buzz:function(){this.tone(150,.45,'sawtooth',.18)},
 pop:function(){this.tone(600,.08,'triangle',.2);this.tone(900,.1,'triangle',.15,.03)},
 fanfare:function(){var f=[523,659,784,1047];for(var i=0;i<f.length;i++){this.tone(f[i],.3,'triangle',.2,i*.13)}this.tone(1047,.7,'triangle',.2,.55)},
 applause:function(){for(var i=0;i<14;i++){this.noise(.13,.12,i*.085+Math.random()*.05)}},
 tick:function(){this.tone(1000,.05,'square',.06)}
};

/* ============ 常用資料 ============ */
var PROMISE_ZH='我願參加小童軍,愛神愛人愛國家。';
var PROMISE_EN='I promise to be a Grasshopper Scout, to love God, to love people and to love my Country.';
var LAW_ZH='小童軍日行一善。';
var LAW_EN='A Grasshopper Scout does a good turn every day.';
var SONG=[
 '小小童軍向前進、向前進、向前進',
 '小小童軍向前進、前進不停。',
 'Greeny, Greeny, Marchin\u2019 On',
 'Marchin\u2019 On, Marchin\u2019 On',
 'Greeny, Greeny, Marchin\u2019 On',
 'Marchin\u2019 On Together'
];

var QUIZ=[

function getRoster(){
 var r=store.get('ghk_roster',null);
 if(!r||!r.length)return[];
 return r;
}
function saveRoster(arr){store.set('ghk_roster',arr)}
function rosterText(){return getRoster().map(function(k){return k.n}).join('\n')}
function parseRoster(txt){
 var old=getRoster();var used={};var out=[];
 txt.split(/\n+/).map(function(s){return s.trim()}).filter(Boolean).forEach(function(name){
  var f=null;
  for(var i=0;i<old.length;i++){if(old[i].n===name&&!used[old[i].id]){f=old[i];break}}
  used[f?f.id:0]=1;
  out.push(f?{id:f.id,n:name}:{id:'k'+Date.now()+'_'+Math.floor(Math.random()*9999),n:name});
 });
 return out;
}

function flowDraw(){
 var s=FLOW.stages[FLOW.idx];if(!s)return;
 var el=$('#fstage');
 if(el)el.innerHTML='<div class="big-msg" style="color:var(--gd)">'+esc(s.n)+'</div><div id="ft" class="big-msg" style="color:var(--g);font-size:clamp(44px,15vw,90px)">'+mmss(FLOW.left)+'</div><div class="center"><span class="tag">第 '+(FLOW.idx+1)+' / '+FLOW.stages.length+' 節</span><span class="tag o">'+(FLOW.run?'⏳ 進行中':'⏸ 暫停中')+'</span></div>';
 var bar=$('#fb');if(bar){var total=FLOW.stages.reduce(function(a,x){return a+x.m*60},0);var done=FLOW.stages.slice(0,FLOW.idx).reduce(function(a,x){return a+x.m*60},0)+(s.m*60-FLOW.left);bar.style.width=Math.min(100,Math.round(done/total*100))+'%'}
 var fs=$('#fsum');if(fs)fs.textContent='全場共 '+FLOW.stages.reduce(function(a,x){return a+x.m},0)+' 分鐘';
}
function mmss(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s}
function flowTick(){
 if(!FLOW.run)return;
 FLOW.left--;
 if(FLOW.left<=10&&FLOW.left>0)Sfx.tick();
 if(FLOW.left<=0){
  Sfx.bell();
  if(FLOW.idx<FLOW.stages.length-1){FLOW.idx++;FLOW.left=FLOW.stages[FLOW.idx].m*60;toastRing('🔔 下一節:'+FLOW.stages[FLOW.idx].n)}
  else{FLOW.run=false;clearInterval(FLOW.int);FLOW.int=null;Sfx.fanfare();toastRing('🎉 今日集會圓滿結束!')}
 }
 flowDraw();
}
function flowToggle(){
 if(FLOW.run){FLOW.run=false;clearInterval(FLOW.int);FLOW.int=null}
 else{FLOW.run=true;if(FLOW.int)clearInterval(FLOW.int);FLOW.int=setInterval(flowTick,1000);Sfx.ding()}
 go('flow');flowDraw();
}
function flowReset(){FLOW.run=false;if(FLOW.int)clearInterval(FLOW.int);FLOW.int=null;FLOW.idx=0;FLOW.left=FLOW.stages[0].m*60;go('flow')}
function flowPrev(){if(FLOW.idx>0){FLOW.idx--;FLOW.left=FLOW.stages[FLOW.idx].m*60;go('flow')}}
function flowNext(manual){if(FLOW.idx<FLOW.stages.length-1){FLOW.idx++;FLOW.left=FLOW.stages[FLOW.idx].m*60;if(manual)Sfx.ding();go('flow')}else{FLOW.run=false;if(FLOW.int)clearInterval(FLOW.int);FLOW.int=null;Sfx.fanfare();go('flow')}}
function flowMin(i,d){FLOW.stages[i].m=Math.max(1,Math.min(60,FLOW.stages[i].m+d));if(i===FLOW.idx)FLOW.left=FLOW.stages[i].m*60;store.set('ghk_flow',FLOW.stages);go('flow')}
function flowDel(i){if(FLOW.stages.length<=1)return;FLOW.stages.splice(i,1);if(FLOW.idx>=FLOW.stages.length)FLOW.idx=FLOW.stages.length-1;FLOW.left=FLOW.stages[FLOW.idx].m*60;store.set('ghk_flow',FLOW.stages);go('flow')}
function flowAdd(){var n=$('#fnn').value.trim();var m=parseInt($('#fnm').value,10)||10;if(!n)return;FLOW.stages.push({n:n,m:m,tool:'arcade',hint:''});store.set('ghk_flow',FLOW.stages);go('flow')}
function flowTool(t){if(t==='home'){go('home')}else{go(t)}}

 onCleanup(function(){if(WH.raf)cancelAnimationFrame(WH.raf)});

function whDraw(){
 var cv=$('#wcv');if(!cv)return;
 var ctx=cv.getContext('2d');
 var cx=320,cy=320,R=300;
 var n=WH.items.length;
 ctx.clearRect(0,0,640,640);
 var colors=['#e53935','#1e88e5','#f9a825','#43a047','#8e24aa','#fb8c00','#00acc1','#d81b60'];
 for(var i=0;i<n;i++){
  var a0=WH.ang+ i*2*Math.PI/n, a1=WH.ang+(i+1)*2*Math.PI/n;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();
  ctx.fillStyle=colors[i%colors.length];ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.rotate((a0+a1)/2);
  ctx.fillStyle='#fff';ctx.font='bold 26px sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
  var nm=WH.items[i];if(nm.length>6)nm=nm.slice(0,6)+'…';
  ctx.fillText(nm,R-14,0);ctx.restore();
 }
 ctx.beginPath();ctx.arc(cx,cy,34,0,7);ctx.fillStyle='#1b5e20';ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🦗',cx,cy+2);
 // pointer
 ctx.beginPath();ctx.moveTo(cx+R+6,cy);ctx.lineTo(cx+R-40,cy-22);ctx.lineTo(cx+R-40,cy+22);ctx.closePath();ctx.fillStyle='#1b5e20';ctx.fill();
}
function whSpin(){

 WH.spinning=true;
 $('#whres').textContent='轉緊…!';
 $('#whres').classList.add('spin');
 var start=performance.now();
 var dur=3800;
 var from=WH.ang;
 var to=WH.ang+ (6+Math.random()*4)*2*Math.PI + Math.random()*2*Math.PI;
 var fn=function(t){
  var p=Math.min(1,(t-start)/dur);
  var e=1-Math.pow(1-p,3);
  WH.ang=from+(to-from)*e;
  whDraw();
  if(p<1){WH.raf=requestAnimationFrame(fn)}
  else{
   WH.spinning=false;$('#whres').classList.remove('spin');
   var n=WH.items.length;
   var pointer=2*Math.PI; // pointer at angle 0 (right side)
   var norm=(WH.ang%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
   // segment under pointer: pointer angle relative = 0; find i where norm falls reversed
   var idx=Math.floor(((2*Math.PI-norm)/(2*Math.PI))*n)%n;
   WH.win=WH.items[Math.max(0,Math.min(n-1,idx))];
   $('#whres').textContent='🎉 '+WH.win+'!';
   Sfx.fanfare();Sfx.applause();
  }
 };
 WH.raf=requestAnimationFrame(fn);
}
function whSave(){
 var arr=$('#whitems').value.split(/\n+/).map(function(s){return s.trim()}).filter(Boolean);
 WH.items=arr.length?arr:['(空的)'];
 whDraw();
 toastRing('✅ 已套用 '+WH.items.length+' 個項目');
}
function whRemove(){
 if(!WH.win){toastRing('未有人中獎呀!');return}
 var i=WH.items.indexOf(WH.win);
 if(i>=0){WH.items.splice(i,1);$('#whitems').value=WH.items.join('\n');WH.win=null;$('#whres').textContent='已攞走,繼續轉!';
  if(WH.items.length>=2){whDraw()}else{$('#whres').textContent='得返一個,唔使轉啦:'+WH.items[0]}
 }
}

 fsReq();

 {t:'book',n:'開始儀式',m:5,hint:'誓詞・規律・口號大字照讀'},
 {t:'move',n:'唱歌律動',m:8,hint:'主題曲卡拉OK+律動指令'},

 {t:'judge:kind',n:'對錯法庭・善行',m:14,hint:'舉👍👎學善行'},
 {t:'judge:sfh',n:'對錯法庭・保護自己',m:14,hint:'Safe from Harm'},
 {t:'guess',n:'估估下',m:12,hint:'剪影投影搶答'},
 {t:'echo',n:'節奏模仿',m:12,hint:'色板記憶挑戰'},
 {t:'memory',n:'記憶配對',m:10,hint:'翻卡配對遊戲'},
 {t:'traffic',n:'紅綠燈',m:10,hint:'自動轉燈+哨子'},
 {t:'simon',n:'領袖話',m:10,hint:'指令反應遊戲'},
 {t:'whack',n:'捉草蜢',m:8,hint:'30秒手眼協調'},
 {t:'chute',n:'快樂傘',m:15,hint:'玩法卡逐個玩'},
 {t:'badge',n:'團員章檢視',m:8,hint:'五件事打✓'},
 {t:'invest',n:'宣誓儀式',m:13,hint:'官方流程照讀'},
 {t:'arcade',n:'遊戲(現場揀)',m:12,hint:'紅綠燈/領袖話/捉草蜢…'},
 {t:'story',n:'靜息+故事',m:10,hint:'呼吸收心+故事骰'},
 {t:'home',n:'散會儀式',m:5,hint:'日行一善分享+冠軍榜'},
 {t:'manual',n:'自訂環節',m:10,hint:'領袖自己帶(例如美勞)'}
];
var DS={draft:null};
function toolStage(tt){
 var parts=tt.split(':');var def=null;
 TOOL_TYPES.forEach(function(x){if(x.t===tt)def=x});
 if(!def)def={n:tt,m:10,hint:''};
 var s={n:def.n,m:def.m,tool:parts[0],hint:def.hint};
 if(parts[1])s.j=parts[1];
 return s;
}
function ttName(s){
 var key=s.tool+(s.j?':'+s.j:'');var f=null;
 TOOL_TYPES.forEach(function(x){if(x.t===key)f=x});
 return f?f.n:s.tool;
}
function getMyPlans(){return store.get('ghk_myplans',[])}
function dsEnsure(){if(!DS.draft)DS.draft={id:'d'+Date.now(),name:'我嘅集會',stages:[]};return DS.draft}
function dsApply(){
 var st=dsEnsure().stages;
 if(!st.length)st=[{n:'集合點名',m:5,tool:'roster'}];
 FLOW.stages=JSON.parse(JSON.stringify(st));FLOW.idx=0;FLOW.left=FLOW.stages[0].m*60;
}
SCREENS.designer={title:'自製集會',tab:'tools',html:function(){
 var d=dsEnsure();
 var tot=d.stages.reduce(function(a,x){return a+x.m},0);
 var h='<div class="card"><h2>🛠️ 自製集會編排工具</h2><div class="mute">用環節積木砌你自己嘅集會:加入環節→調次序→校分鐘→儲存到「我嘅集會」,隨時▶全自動帶領,或者匯出文字分享俾其他領袖。</div></div>';
 h+='<div class="card"><label class="fld">集會名稱</label><input type="text" id="dsname" value="'+esc(d.name)+'">'+
 '<div class="center" style="margin:8px 0"><span class="tag o" style="font-size:16px">'+d.stages.length+' 個環節 ・ '+tot+' 分鐘</span></div>'+
 '<button class="btn" onclick="dsSave()">💾 儲存</button>'+
 '<button class="btn purple" onclick="dsApply();liveStart(0)">▶ 直接帶領</button>'+
 '<button class="btn ghost" onclick="dsApply();store.set(\'ghk_flow\',FLOW.stages);go(\'flow\')">📋 流程台(半自動)</button>'+
 '<button class="btn gray" onclick="DS.draft=null;go(\'designer\')">↺ 清空</button></div>';
 h+='<div class="card"><h3>環節次序</h3>';
 if(!d.stages.length)h+='<div class="mute">仲未有環節——喺下面「➕ 加入環節」開始砌!</div>';
 d.stages.forEach(function(s,i){
  h+='<div class="stage"><div class="no">'+(i+1)+'</div><div class="inf"><div class="nm">'+esc(s.n)+'</div><div class="mn">'+esc(ttName(s))+(s.hint?' ・ '+esc(s.hint):'')+'</div></div>'+
  '<div style="text-align:center"><button class="btn sm gray" onclick="dsMin('+i+',-5)">−</button><div class="clk">'+s.m+'′</div><button class="btn sm gray" onclick="dsMin('+i+',5)">+</button></div>'+
  '<div style="display:flex;flex-direction:column;gap:3px"><button class="btn sm ghost" onclick="dsUp('+i+')">↑</button><button class="btn sm ghost" onclick="dsDown('+i+')">↓</button></div>'+
  '<button class="btn sm red" onclick="dsDel('+i+')">✕</button></div>';
 });
 h+='</div>';
 h+='<div class="card"><h3>➕ 加入環節</h3><div class="grid g3">';
 TOOL_TYPES.forEach(function(x,i){h+='<button class="btn sm '+(i%2?'ghost':'')+'" onclick="dsAdd(\''+x.t+'\')">'+x.n+' '+x.m+'′</button>'});
 h+='</div><hr class="sep"><label class="fld">或者自訂環節名稱</label><div class="grid g3">'+
 '<input type="text" id="dscustom" placeholder="例如:美勞創作・參觀消防局"><input type="number" id="dscustomm" value="10" min="1" max="60"><button class="btn" onclick="dsAddCustom()">➕ 加入</button></div></div>';
 var mp=getMyPlans();
 h+='<div class="card"><h3>📚 我嘅集會('+mp.length+')</h3>';
 if(!mp.length)h+='<div class="mute">儲存嘅集會會出現喺度,隨時攞嚟帶。</div>';
 mp.forEach(function(p,i){
  var pt=p.stages.reduce(function(a,x){return a+x.m},0);
  h+='<div class="stage"><div class="no">📘</div><div class="inf"><div class="nm">'+esc(p.name)+'</div><div class="mn">'+p.stages.length+'環節 ・ '+pt+'分鐘</div></div>'+
  '<button class="btn sm purple" onclick="dsPlayMy('+i+')">▶</button>'+
  '<button class="btn sm ghost" onclick="dsEditMy('+i+')">✏️</button>'+
  '<button class="btn sm red" onclick="dsDelMy('+i+')">✕</button></div>';
 });
 h+='</div>';
 h+='<div class="card"><h3>📤 分享 / 📥 匯入</h3><div class="mute">撳「匯出」→全選複製→傳俾其他領袖;對方貼喺呢個格仔撳「匯入」就有晒成個集會。</div>'+
 '<textarea id="dsexp" placeholder="匯出嘅集會文字會出現喺度;匯入就貼上文字再撳按鈕"></textarea>'+
 '<button class="btn sm" onclick="dsExp()">📤 匯出目前草稿</button> <button class="btn sm blue" onclick="dsImp()">📥 匯入到草稿</button></div>';
 return h;
}};
function dsAdd(tt){dsEnsure().stages.push(toolStage(tt));go('designer')}
function dsAddCustom(){var n=$('#dscustom').value.trim();var m=parseInt($('#dscustomm').value,10)||10;if(!n)return;dsEnsure().stages.push({n:n,m:m,tool:'manual',hint:'領袖自己帶領'});go('designer')}
function dsMin(i,d){var st=dsEnsure().stages;st[i].m=Math.max(1,st[i].m+d);go('designer')}
function dsUp(i){var st=dsEnsure().stages;if(i>0){var t=st[i-1];st[i-1]=st[i];st[i]=t;go('designer')}}
function dsDown(i){var st=dsEnsure().stages;if(i<st.length-1){var t=st[i+1];st[i+1]=st[i];st[i]=t;go('designer')}}
function dsDel(i){dsEnsure().stages.splice(i,1);go('designer')}
function dsSave(){
 var d=dsEnsure();d.name=($('#dsname').value.trim())||'我嘅集會';d.at=Date.now();
 var mp=getMyPlans();var idx=-1;mp.forEach(function(p,i){if(p.id===d.id)idx=i});
 var copy=JSON.parse(JSON.stringify(d));
 if(idx>=0)mp[idx]=copy;else mp.push(copy);
 store.set('ghk_myplans',mp);toastRing('✅ 已儲存「'+d.name+'」');go('designer');
}
function dsPlayMy(i){var mp=getMyPlans();FLOW.stages=JSON.parse(JSON.stringify(mp[i].stages));FLOW.idx=0;FLOW.left=FLOW.stages[0].m*60;liveStart(0)}
function dsEditMy(i){var mp=getMyPlans();DS.draft=JSON.parse(JSON.stringify(mp[i]));go('designer')}
function dsDelMy(i){var mp=getMyPlans();mp.splice(i,1);store.set('ghk_myplans',mp);go('designer')}
function dsExp(){$('#dsexp').value=JSON.stringify(dsEnsure());toastRing('已匯出,撳一下個格仔全選複製!')}
function dsImp(){
 try{var o=JSON.parse($('#dsexp').value);if(!o||!o.stages||!o.stages.length)throw 0;
  DS.draft={id:'d'+Date.now(),name:o.name||'匯入集會',stages:o.stages};go('designer');toastRing('✅ 匯入成功!');
 }catch(e){toastRing('匯入失敗:文字格式唔啱')}
}
function dsFromFlow(){DS.draft={id:'d'+Date.now(),name:'我嘅集會',stages:JSON.parse(JSON.stringify(FLOW.stages))};go('designer')}
function bManual(st){
 return{t:(st&&st.n)||'自訂環節',s:(st&&st.hint)||'領袖自己帶領;計時照常倒數',h:'<div class="hline" style="font-size:clamp(28px,8vw,64px)">'+esc((st&&st.n)||'自訂環節')+'</div><div class="hsub">'+esc((st&&st.hint)||'呢個環節由領袖自己帶領')+'</div><div class="hsub" style="margin-top:12px">⏱ 這環節由你話事,倒數照常進行</div>'};
}
