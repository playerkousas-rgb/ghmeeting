<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e65100">
<title>🦗 小童軍集會助手 Grasshopper Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="stickytop">
  <header id="topbar">
    <div class="brand" onclick="location.hash='#plan'">🦗 小童軍集會助手</div>
    <div class="topbtns">
      <button class="iconbtn" onclick="Kit.searchOpen()" title="🔍 全站搵嘢：範本・手工・圖紙・物料">🔍</button>
      <button class="iconbtn" onclick="App.go('#track')" title="🏅 記錄：團員名單・出席・獎章進度">🏅</button>
      <button class="iconbtn" onclick="App.settings()" title="⚙️ 旅團設定">⚙️</button>
    </div>
  </header>
  <!-- 🅰️ 上方＝五個入口：集會目錄→範本→帶領→官方套包→手冊 -->
  <nav id="topnav" aria-label="集會入口">
    <div class="navcap a">🅰️ 上：由目錄到帶領（事前準備）</div>
    <div class="navrow">
      <a href="#plan" data-tab="plan"><span>📅</span>集會目錄</a>
      <a href="#meet" data-tab="meet"><span>🧩</span>範本</a>
      <a href="#lead" data-tab="lead"><span>▶️</span>帶領</a>
      <a href="#pack" data-tab="pack"><span>📦</span>官方套包</a>
      <a href="#book" data-tab="book"><span>📖</span>手冊</a>
    </div>
  </nav>
  </div>
  <main id="view"></main>
  <!-- 🧭 step by step：揀咗集會之後，一步步帶到散會 -->
  <div id="flowbar"></div>
  <!-- 🅱️ 下方＝即插即用：集會途中先至會撳 -->
  <nav id="tabbar" aria-label="即插即用">
    <div class="navcap b">🅱️ 下：即插即用（集會中途撳）</div>
    <div class="navrow">
      <a href="#print" data-tab="print"><span>✂️</span>工作紙</a>
      <a href="#play" data-tab="play"><span>🎮</span>活動</a>
      <a href="#song" data-tab="song"><span>🎵</span>歌曲</a>
      <a href="#chute" data-tab="chute"><span>🌈</span>快樂傘</a>
      <a href="#tools" data-tab="tools"><span>🎲</span>快鍵</a>
    </div>
  </nav>
</div>
<div id="leadroot" class="hidden"></div>
<div id="modal"></div>
<script src="js/data.js"></script>
<script src="js/guide.js"></script>
<script src="js/craft.js"></script>
<script src="js/sheets.js"></script>
<script src="js/tpls.js"></script>
<script src="js/app.js"></script>
<script src="js/flow.js"></script>
<script src="js/prepare.js"></script>
<script src="js/print.js"></script>
<script src="js/pack.js"></script>
<script src="js/lead.js"></script>
<script src="js/img.js"></script>
<script src="js/track.js"></script>
<script src="js/handbook.js"></script>
<script src="js/play.js"></script>
<script src="js/venue.js"></script>
<script src="js/kit.js"></script>
<script src="js/chute.js"></script>
<script src="js/song.js"></script>
<script src="js/tools.js"></script>
<script>
if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});}
App.init();
</script>
</body>
</html>
